[versions]
agp = "9.3.1"
ftpserverCore = "1.2.1"
glide = "5.0.9"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activityKtx = "1.8.0"
constraintlayout = "2.1.4"
slf4jAndroid = "1.7.36"
ftpserver = "1.2.1"
slf4j = "1.7.36"


[libraries]
compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }
